[package]
name = "designer"
version = "0.1.0"
edition = "2021"
description = "TinyTracer scene designer: raycast preview and side panel"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui-wgpu = "0.37"
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
